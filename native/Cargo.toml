[package]
name = "wootdeck-helper"
version = "0.1.6"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }
libloading = "=0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
